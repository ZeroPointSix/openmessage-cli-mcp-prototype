name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENMESSAGE_E2E_BASE_URL: ${{ secrets.OPENMESSAGE_E2E_BASE_URL }}
      OPENMESSAGE_E2E_API_KEY: ${{ secrets.OPENMESSAGE_E2E_API_KEY }}
      OPENMESSAGE_E2E_DESTINATION: ${{ secrets.OPENMESSAGE_E2E_DESTINATION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Real OpenMessage E2E
        if: ${{ env.OPENMESSAGE_E2E_BASE_URL != '' && env.OPENMESSAGE_E2E_API_KEY != '' && env.OPENMESSAGE_E2E_DESTINATION != '' }}
        run: pnpm test:e2e:real
      - name: Real OpenMessage E2E unavailable
        if: ${{ env.OPENMESSAGE_E2E_BASE_URL == '' || env.OPENMESSAGE_E2E_API_KEY == '' || env.OPENMESSAGE_E2E_DESTINATION == '' }}
        run: echo "::notice::Real OpenMessage E2E skipped; configure OPENMESSAGE_E2E_BASE_URL, OPENMESSAGE_E2E_API_KEY, and OPENMESSAGE_E2E_DESTINATION repository secrets."
